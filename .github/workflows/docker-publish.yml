name: Tests et publication de l'image Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests de l'application
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-mlops.txt

      - name: Lancer les tests
        run: python -m pytest -q

  publier:
    name: Publier l'image dans GHCR
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cephora52/telecom-credit-risk-api:latest
            ghcr.io/cephora52/telecom-credit-risk-api:${{ github.sha }}
